[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rpt-sdk"
version = "0.2.1"
description = "The Python implementation of the rpt plugin protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["rpt", "pentest", "report", "plugin", "jsonl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/astr4liteEx/rpt"
Documentation = "https://github.com/astr4liteEx/rpt/blob/main/docs/plugin-protocol.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rpt_sdk"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
